
services:
  postgres:
    image: postgres:latest
    container_name: natega_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: natega
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - natega-net

  natega-api:
    image: yusufhussien/natega-api:1.0
    container_name: natega-api
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/natega
      DB_USERNAME: root
      DB_PASSWORD: 1
    ports:
      - "8080:8080"
    networks:
      - natega-net


  natega-bot:
    image: yusufhussien/natega-bot:1.0
    container_name: natega-bot
    depends_on:
      - natega-api
    environment:
      API_URL: http://natega-api:8080/api/v1/students
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME}
    ports:
      - "8081:8081"
    networks:
      - natega-net


volumes:
  postgres-data:

networks:
  natega-net:
    driver: bridge
